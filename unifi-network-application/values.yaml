## unifi-network-application image version
## ref: https://hub.docker.com/r/captnbp/unifi-network-application/tags
## @param image.registry [default: REGISTRY_NAME] unifi-network-application image registry
## @param image.repository [default: REPOSITORY_NAME/unifi-network-application] unifi-network-application image repository
## @skip image.tag unifi-network-application image tag (immutable tags are recommended)
## @param image.digest unifi-network-application image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy unifi-network-application image pull policy
## @param image.pullSecrets Specify docker-registry secret names as an array
## @param image.debug Specify if debug logs should be enabled
##
image:
  registry: docker.io
  repository: captnbp/unifi-network-application
  tag: 10.0.162
  digest: ""
  ## Specify a imagePullPolicy
  ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
  ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## Example:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []

## @param command Override default container command (useful when using custom images)
##
command: []
## @param args Override default container args (useful when using custom images)
##
args: []
## @param extraEnvVars Extra environment variables to be set on unifi-network-application container
## Example:
## extraEnvVars:
##   - name: FOO
##     value: "bar"
##
extraEnvVars: []
## @param extraEnvVarsCM Name of existing ConfigMap containing extra env vars
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Name of existing Secret containing extra env vars
##
extraEnvVarsSecret: ""

## @section unifi-network-application statefulset parameters

## @param containerPorts.https unifi-network-application HTTPS container port
## @param containerPorts.captiveHttp unifi-network-application HTTP for captive portail container port
## @param containerPorts.captiveHttps unifi-network-application HTTPS for captive portail container port
## @param containerPorts.controller unifi-network-application HTTP for controller container port
## @param containerPorts.speedtest unifi-network-application HTTP for speedtest container port
## @param containerPorts.stun unifi-network-application UDP for stun container port
## @param containerPorts.discovery unifi-network-application UDP for discovery container port
##
containerPorts:
  https: 8443
  captiveHttp: 8880
  captiveHttps: 8843
  controller: 8080
  speedtest: 6789
  stun: 3478
  discovery: 10001

## @param extraContainerPorts Optionally specify extra list of additional port-mappings for unifi-network-application container
##
extraContainerPorts: []

## unifi-network-application pods' SecurityContext
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
## @param podSecurityContext.enabled Enabled unifi-network-application pods' Security Context
## @param podSecurityContext.fsGroup Set unifi-network-application pod's Security Context fsGroup
##
podSecurityContext:
  enabled: true
  fsGroup: 100
## unifi-network-application containers' Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## @param containerSecurityContext.enabled Enabled containers' Security Context
## @param containerSecurityContext.runAsUser Set containers' Security Context runAsUser
## @param containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
## @param containerSecurityContext.privileged Set container's Security Context privileged
## @param containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
## @param containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
## @param containerSecurityContext.capabilities.drop List of capabilities to be dropped
## @param containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
##
containerSecurityContext:
  enabled: true
  runAsUser: 100
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add:
      - SETFCAP
  seccompProfile:
    type: "RuntimeDefault"
## unifi-network-application resource requests and limits
## ref: https://kubernetes.io/docs/user-guide/compute-resources/
## @param resources.limits The resources limits for the unifi-network-application containers
## @param resources.requests The requested resources for the unifi-network-application containers
##
resources:
  limits: {}
  requests: {}

