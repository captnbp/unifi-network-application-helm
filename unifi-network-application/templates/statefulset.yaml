apiVersion: {{ include "common.capabilities.statefulset.apiVersion" . }}
kind: StatefulSet
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: unifi-network-application
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  serviceName: {{ printf "%s" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  updateStrategy:
    {{- include "common.tplvalues.render" (dict "value" .Values.updateStrategy "context" $ ) | nindent 4 }}
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.podLabels .Values.commonLabels ) "context" . ) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
      app.kubernetes.io/component: unifi-network-application
  template:
    metadata:
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        checksum/configuration: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
      labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: unifi-network-application
    spec:
      serviceAccountName: {{ template "unifi-network-application.serviceAccountName" . }}
      {{- include "unifi-network-application.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" ( dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "customLabels" $podLabels "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "customLabels" $podLabels "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" ( dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig: {{- include "common.tplvalues.render" (dict "value" .Values.dnsConfig "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- include "common.tplvalues.render" (dict "value" .Values.initContainers "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: unifi-network-application
          image: {{ template "unifi-network-application.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else if .Values.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: MONGO_TLS
              value: "false"
            - name: MEM_LIMIT
              value: "1024"
            - name: MEM_STARTUP
              value: "1024"
            - name: MONGO_AUTHSOURCE
              value: ""
            {{- if .Values.externalDatabase.existingSecretStatsPasswordKey }}
            - name: MONGO_STATS_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-network-application.statsDatabaseSecretName" . }}
                  key: {{ include "unifi-network-application.statsDatabaseSecretPasswordKey" . }}
            {{- else }}
            - name: MONGO_STATS_PASS
              value: {{ .Values.externalDatabase.statsPassword }}
            {{- end }}
            {{- if .Values.externalDatabase.existingSecretPasswordKey }}
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-network-application.databaseSecretName" . }}
                  key: {{ include "unifi-network-application.databaseSecretPasswordKey" . }}
            {{- else }}
            - name: MONGO_PASS
              value: {{ .Values.externalDatabase.password }}
            {{- end }}
            {{- if .Values.externalDatabase.existingSecretHostKey }}
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-network-application.databaseSecretName" . }}
                  key: {{ include "unifi-network-application.databaseSecretHostKey" . }}
            {{- else }}
            - name: MONGO_HOST
              value: {{ .Values.externalDatabase.host }}
            {{- end }}
            {{- if .Values.externalDatabase.existingSecretPortKey }}
            - name: MONGO_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-network-application.databaseSecretName" . }}
                  key: {{ include "unifi-network-application.databaseSecretPortKey" . }}
            {{- else }}
            - name: MONGO_PORT
              value: {{ .Values.externalDatabase.port | quote }}
            {{- end }}
            {{- if .Values.externalDatabase.existingSecretStatsUserKey }}
            - name: MONGO_STATS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-network-application.statsDatabaseSecretName" . }}
                  key: {{ include "unifi-network-application.statsDatabaseSecretUserKey" . }}
            {{- else }}
            - name: MONGO_STATS_USER
              value: {{ .Values.externalDatabase.statsUser }}
            {{- end }}
            {{- if .Values.externalDatabase.existingSecretUserKey }}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-network-application.databaseSecretName" . }}
                  key: {{ include "unifi-network-application.databaseSecretUserKey" . }}
            {{- else }}
            - name: MONGO_USER
              value: {{ .Values.externalDatabase.user }}
            {{- end }}
            {{- if .Values.externalDatabase.existingSecretStatsDatabaseKey }}
            - name: MONGO_STATS_DBNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-network-application.statsDatabaseSecretName" . }}
                  key: {{ include "unifi-network-application.statsDatabaseSecretDatabaseKey" . }}
            {{- else }}
            - name: MONGO_STATS_DBNAME
              value: {{ .Values.externalDatabase.statsDatabase }}
            {{- end }}
            {{- if .Values.externalDatabase.existingSecretDatabaseKey }}
            - name: MONGO_DBNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "unifi-network-application.databaseSecretName" . }}
                  key: {{ include "unifi-network-application.databaseSecretDatabaseKey" . }}
            {{- else }}
            - name: MONGO_DBNAME
              value: {{ .Values.externalDatabase.database }}
            {{- end }}
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsSecret "context" $) }}
            {{- end }}
          {{- end }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.containerPorts.https }}
              protocol: TCP
            - name: controller
              containerPort: {{ .Values.containerPorts.controller }}
              protocol: TCP
            - name: captive-http
              containerPort: {{ .Values.containerPorts.captiveHttp }}
              protocol: TCP
            - name: captive-https
              containerPort: {{ .Values.containerPorts.captiveHttps }}
              protocol: TCP
            - name: speedtest
              containerPort: {{ .Values.containerPorts.speedtest }}
              protocol: TCP
            - name: stun
              containerPort: {{ .Values.containerPorts.stun }}
              protocol: UDP
            - name: discovery
              containerPort: {{ .Values.containerPorts.discovery }}
              protocol: UDP
            {{- if .Values.extraContainerPorts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraContainerPorts "context" $) | nindent 12 }}
            {{- end }}
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.customstartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customstartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.startupProbe.enabled }}
          startupProbe: {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
          {{- end }}
          {{- if .Values.customlivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customlivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.livenessProbe.enabled }}
          livenessProbe: {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
          {{- end }}
          {{- if .Values.customreadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customreadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.readinessProbe.enabled }}
          readinessProbe: {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if .Values.tls.enabled }}
            - name: certificates
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: {{ include "unifi-network-application.metrics.image" . }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy | quote }}
          args: ["-c", "/etc/unifi-poller/up.yaml"]
          ports:
            - name: metrics
              containerPort: 9130
          env:
            - name: UP_UNIFI_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-network-application
                  key: password
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            timeoutSeconds: 1
          {{- if .Values.metrics.resources }}
          resources: {{- toYaml .Values.metrics.resources | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: configuration
              mountPath: /etc/unifi-poller/up.yaml
              subPath: up.yaml
        {{- end }}
        {{- if .Values.sidecars }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        {{- if .Values.metrics.enabled }}
        - name: configuration
          configMap:
            defaultMode: 0444
            name: {{ template "common.names.fullname" . }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: certificates
          secret:
            secretName: {{ include "common.names.fullname" . }}-crt
            defaultMode: 420
        {{- end }}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "common.names.fullname" .) }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- if .Values.persistence.annotations }}
        annotations: {{- include "common.tplvalues.render" (dict "value" .Values.persistence.annotations "context" $) | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
        {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if .Values.persistence.selector }}
        selector: {{- include "common.tplvalues.render" ( dict "value" .Values.persistence.selector "context" $) | nindent 10 }}
        {{- end }}
        {{ include "common.storage.class" (dict "persistence" .Values.persistence "global" .Values.global) }}
  {{- end }}